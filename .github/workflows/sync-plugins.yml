name: sync plugin mirrors

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-plugin-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scan upstream packages and mirror updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-plugins.mjs --apply
      - id: changes
        name: Detect catalog source changes
        shell: bash
        run: |
          if git diff --quiet -- catalog/plugins; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: pnpm catalog
      - if: steps.changes.outputs.changed == 'true'
        name: Sign catalog
        env:
          DSH_MARKETPLACE_SIGNING_KEY_PEM: ${{ secrets.DSH_MARKETPLACE_SIGNING_KEY_PEM }}
        run: pnpm catalog:sign
      - run: pnpm validate
      - if: steps.changes.outputs.changed == 'true'
        name: Commit synchronized versions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/catalog.json catalog/catalog.sig catalog/plugins
          git commit -m 'chore: sync plugin mirrors'
          git push origin HEAD:main
